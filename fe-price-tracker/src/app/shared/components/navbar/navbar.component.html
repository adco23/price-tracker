<div class="w-full pb-3 border-t border-solid border-slate-200 flex justify-around items-center bg-white">
  <button type="button" class="flex justify-center items-center"><a href="/"><i class="lni lni-home text-blue-p-300 font-bold flex justify-center items-center"></i></a></button>
  <button type="button" class="flex justify-center items-center"><a href="/"><i class="lni lni-list text-blue-p-300 font-bold flex justify-center items-center"></i></a></button>
  <button type="button"
    class="w-12 h-12 rounded-full bg-blue-p-500 flex justify-center items-center ring-4 ring-slate-200 active:animate-rotation-reverse"
    cdkOverlayOrigin #addmenu="cdkOverlayOrigin"
    (click)="isOpenMenu.set(!isOpenMenu())"
    >
    <!-- <i class="lni lni-plus text-white font-bold"></i> -->
    @if (!isOpenMenu()) { <i class="lni lni-plus text-xl font-bold text-white"></i> }
    @else { <i class="lni lni-close text-xl font-bold text-white"></i> }
  </button>
  <button type="button" class="flex justify-center items-center"><a href="#"><i class="lni lni-heart text-blue-p-300 font-bold flex justify-center items-center"></i></a></button>
  <button type="button" class="flex justify-center items-center"><a href="#"><i class="lni lni-user text-blue-p-300 font-bold flex justify-center items-center"></i></a></button>
</div>


<ng-template cdkPortal cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="addmenu"
  [cdkConnectedOverlayOpen]="isOpenMenu()"
  [cdkConnectedOverlayPositions]="[{ originX: 'center', originY: 'top', overlayX: 'center', overlayY: 'bottom' }]"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayBackdropClass]="'bg-transparent'"
  (backdropClick)="toggleMenu()"
>
  <div class="flex flex-row animate-spongy bg-blue-p-500 shadow-md shadow-blue-p-200 mb-6 rounded-2xl">
    <button type="button"><a href="create/brand" class="flex text-white p-2 flex-col items-center text-lg"><i class="lni lni-shopping-basket"></i></a></button>
    <button type="button"><a href="create/product" class="flex text-white p-2 flex-col items-center text-stext-lg"><i class="lni lni-cart"></i></a></button>
    <button type="button"><a href="create/unit" class="flex text-white p-2 flex-col items-center text-lg"><i class="lni lni-ruler-alt"></i></a></button>
    <button type="button"><a href="/" class="flex text-white p-2 flex-col items-center text-lg"><i class="lni lni-invest-monitor"></i></a></button>
    <button type="button"><a href="create/store" class="flex text-white p-2 flex-col items-center text-lg"><i class="lni lni-map-marker"></i></a></button>
  </div>
</ng-template>
